syntax = "proto3";

package vector_db;

service ReplicaManager {
  rpc Sync(SyncRequest) returns (SyncResponse);
}

message SyncRequest {
  repeated WALEntry entry = 1;
}

message SyncResponse {}

message WALEntry {
  enum Type {
    INSERT = 0;
    REMOVE = 1;
  }

  Type type = 1;
  string table = 2;
  uint64 id = 3;
  repeated float vector = 4;
  string content = 5;
}
