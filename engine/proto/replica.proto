syntax = "proto3";

package vector_db;

service ReplicaManager {
  rpc Sync(SyncRequest) returns (SyncResponse);
  rpc Drop(DropRequest) returns (DropResponse);
  rpc Create(CreateRequest) returns (CreateResponse);
}

message SyncRequest {
  repeated WALEntry entry = 1;
}

message SyncResponse {}

message WALEntry {
  enum Type {
    INSERT = 0;
    REMOVE = 1;
  }

  Type type = 1;
  string table = 2;
  uint64 id = 3;
  repeated float vector = 4;
  string content = 5;
}

message DropRequest {
  string table = 1;
}

message DropResponse {}

message CreateRequest {
  string table = 1;

  message StoreConfig {
    int32 vector_dimensionality = 1;
  }

  StoreConfig store_config = 2;

  message HNSWIndexConfig {
    uint64 m = 1;
    uint64 m0 = 2;
    uint64 ef_construction = 3;
    float ml = 4;
    int32 vector_dimensionality = 5;

    enum DistanceMetric {
      L2 = 0;
      COSINE = 1;
    }

    DistanceMetric distance_metric = 6;
  }

  oneof index_config {
    HNSWIndexConfig hnsw_index_config = 3;
  }

  message CacheConfig {
    uint64 cache_size = 1;
  }

  CacheConfig cache_config = 4;
}

message CreateResponse {}
