---
apiVersion: v1
kind: Service
metadata:
  name: vector-database-primary-service
spec:
  type: LoadBalancer
  selector:
    statefulset.kubernetes.io/pod-name: vector-database-0
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: vector-database-internal-service
spec:
  clusterIP: None
  selector:
    app: vector-database
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: vector-database-replica-service
spec:
  type: LoadBalancer
  selector:
    statefulset.kubernetes.io/pod-name: vector-database-1
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
